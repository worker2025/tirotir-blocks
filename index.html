e(a,b)\n for a,b in [('\u0628\u0632\u0631\u06af\u062a\u0631 \u06cc\u0627 \u0645\u0633\u0627\u0648\u06cc','>='),('\u06a9\u0648\u0686\u06a9\u062a\u0631 \u06cc\u0627 \u0645\u0633\u0627\u0648\u06cc','<='),('\u0628\u0631\u0627\u0628\u0631 \u0628\u0627','=='),('\u0646\u0627 \u0628\u0631\u0627\u0628\u0631 \u0628\u0627','!='),('\u0628\u0632\u0631\u06af\u062a\u0631 \u0627\u0632','>'),('\u06a9\u0648\u0686\u06a9\u062a\u0631 \u0627\u0632','<')]:src=re.sub(r'(?<![\\w\\u0600-\\u06ff])'+re.escape(a)+r'(?![\\w\\u0600-\\u06ff])',b,src)\n return Parser(tokenize(src)).parse()\ndef execute(src,output=None,input_fn=None,scene_path=None,play_audio=False,capabilities=None,runtime_context=None):\n if capabilities is not None and runtime_context is not None:raise CapabilityError('capabilities \u0648 runtime_context \u0631\u0627 \u0647\u0645\u200c\u0632\u0645\u0627\u0646 \u0627\u0631\u0633\u0627\u0644 \u0646\u06a9\u0646\u06cc\u062f.')\n if runtime_context is None:runtime_context=RuntimeContext.from_capabilities(capabilities)\n p=parse(src);runner=Interpreter(output,input_fn,play_audio=play_audio,runtime_context=runtime_context);runner.run(p)\n if hasattr(runner,'scene'):runner.scene.save(scene_path or 'tirotir-scene.svg')\n return p\n", "contracts.py": "\"\"\"\u0642\u0631\u0627\u0631\u062f\u0627\u062f\u0647\u0627\u06cc \u067e\u0627\u06cc\u062f\u0627\u0631 \u0645\u0639\u0645\u0627\u0631\u06cc \u062a\u06cc\u0631\u0648\u062a\u06cc\u0631 \u06f2\u066b\u06f0.\n\n\u0627\u06cc\u0646 \u0645\u0627\u0698\u0648\u0644 \u0628\u0627\u06cc\u062f \u0645\u0633\u062a\u0642\u0644 \u0627\u0632 parser\u060c interpreter \u0648 backend\u0647\u0627 \u0628\u0645\u0627\u0646\u062f \u062a\u0627 \u0627\u0628\u0632\u0627\u0631\u0647\u0627\n\u0628\u062a\u0648\u0627\u0646\u0646\u062f \u0642\u0631\u0627\u0631\u062f\u0627\u062f\u0647\u0627\u06cc \u0632\u0628\u0627\u0646 \u0631\u0627 \u0628\u062f\u0648\u0646 \u0627\u062c\u0631\u0627\u06cc \u0628\u0631\u0646\u0627\u0645\u0647 \u0645\u0635\u0631\u0641 \u06a9\u0646\u0646\u062f.\n\"\"\"\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom typing import Any, Mapping, Protocol, Sequence\n\nCONTRACT_VERSION = \"2.0-contract-1\"\nLANGUAGE_V1 = \"1.1\"\n\n@dataclass(frozen=True)\nclass SourceSpan:\n    \"\"\"\u0645\u062d\u062f\u0648\u062f\u0647\u0654 \u062f\u0642\u06cc\u0642 \u06cc\u06a9 token\u060c node \u06cc\u0627 diagnostic \u062f\u0631 \u0645\u062a\u0646 \u0645\u0646\u0628\u0639.\"\"\"\n    source: str = \"<\u0645\u062a\u0646>\"\n    start_line: int = 1\n    start_column: int = 1\n    end_line: int = 1\n    end_column: int = 1\n\n    def to_dict(self) -> dict[str, Any]:\n        return {\n            \"source\": self.source,\n            \"start\": {\"line\": self.start_line, \"column\": self.start_column},\n            \"end\": {\"line\": self.end_line, \"column\": self.end_column},\n        }\n\n@dataclass(frozen=True)\nclass NodeId:\n    \"\"\"\u0634\u0646\u0627\u0633\u0647\u0654 \u067e\u0627\u06cc\u062f\u0627\u0631 \u062f\u0631 \u0637\u0648\u0644 \u06cc\u06a9 parse \u0628\u0631\u0627\u06cc \u0627\u0628\u0632\u0627\u0631 formatter \u0648 debugger.\"\"\"\n    value: str\n\n    def __str__(self) -> str:\n        return self.value\n\n@dataclass(frozen=True)\nclass Diagnostic:\n    \"\"\"\u062e\u0637\u0627\u06cc \u0642\u0627\u0628\u0644 \u0645\u0635\u0631\u0641 \u0628\u0631\u0627\u06cc CLI\u060c LSP \u0648 \u0645\u062d\u06cc\u0637 \u0622\u0645\u0648\u0632\u0634\u06cc.\"\"\"\n    code: str\n    severity: str\n    type: str\n    message: str\n    span: SourceSpan = field(default_factory=SourceSpan)\n    suggestion: str | None = None\n    source_text: str | None = None\n\n    def to_dict(self) -> dict[str, Any]:\n        result = {\n            \"code\": self.code,\n            \"severity\": self.severity,\n            \"type\": self.type,\n            \"message\": self.message,\n            \"span\": self.span.to_dict(),\n        }\n        if self.suggestion is not None:\n            result[\"suggestion\"] = self.suggestion\n        if self.source_text is not None:\n            result[\"source_text\"] = self.source_text\n        return result\n\nclass Capability(str, Enum):\n    CORE = \"core\"\n    GRAPHICS = \"graphics\"\n    AUDIO = \"audio\"\n    GUI = \"gui\"\n    PROJECT_FILES = \"project-files\"\n    NETWORK = \"network\"\n\nclass CapabilityError(PermissionError):\n    \"\"\"\u0648\u0642\u062a\u06cc \u0633\u0631\u0648\u06cc\u0633 \u062e\u0627\u0631\u062c \u0627\u0632 capability\u0647\u0627\u06cc \u0641\u0639\u0627\u0644 \u062f\u0631\u062e\u0648\u0627\u0633\u062a \u0634\u0648\u062f.\"\"\"\n\nclass RuntimeService(Protocol):\n    \"\"\"\u0642\u0631\u0627\u0631\u062f\u0627\u062f \u0645\u0634\u062a\u0631\u06a9 \u0633\u0631\u0648\u06cc\u0633\u200c\u0647\u0627\u06cc runtime \u0645\u0627\u0646\u0646\u062f graphics\u060c audio \u0648 GUI.\"\"\"\n    name: str\n    capability: Capability\n\n    def call(self, operation: str, args: Sequence[Any]) -> Any:\n        ...\n\nclass CapabilityRegistry:\n    \"\"\"whitelist \u0633\u0631\u0648\u06cc\u0633\u200c\u0647\u0627\u06cc \u0641\u0639\u0627\u0644\u061b \u062d\u0627\u0644\u062a \u067e\u06cc\u0634\u200c\u0641\u0631\u0636 \u0641\u0642\u0637 core \u0627\u0633\u062a.\"\"\"\n    def __init__(self, enabled: Sequence[Capability | str] | None = None):\n        values = (Capability.CORE,) if enabled is None else enabled\n        self._enabled = {Capability(v) for v in values}\n\n    @classmethod\n    def from_mapping(cls, mapping: Mapping[str, Any] | None = None):\n        \"\"\"\u0633\u0627\u062e\u062a policy \u0627\u0632 \u0628\u062e\u0634 capabilities \u062f\u0631 \u062a\u0646\u0638\u06cc\u0645\u0627\u062a \u067e\u0631\u0648\u0698\u0647.\"\"\"\n        enabled = [Capability.CORE]\n        for raw_name, raw_value in (mapping or {}).items():\n            try:\n                capability = Capability(raw_name)\n            except ValueError as exc:\n                raise CapabilityError(f'\u0642\u0627\u0628\u0644\u06cc\u062a \u0646\u0627\u0634\u0646\u0627\u062e\u062a\u0647 \u00ab{raw_name}\u00bb \u0627\u0633\u062a.') from exc\n            if isinstance(raw_value, bool):\n                active = raw_value\n            elif isinstance(raw_value, str):\n                active = raw_value.strip().lower() not in {'', '0', 'false', 'no', 'off', 'none'}\n            else:\n                raise CapabilityError(f'\u0645\u0642\u062f\u0627\u0631 \u0642\u0627\u0628\u0644\u06cc\u062a \u00ab{raw_name}\u00bb \u0628\u0627\u06cc\u062f boolean \u06cc\u0627 \u0645\u062a\u0646 \u0628\u0627\u0634\u062f.')\n            if active and capability not in enabled:\n                enabled.append(capability)\n        return cls(enabled)\n\n    def allows(self, capability: Capability | str) -> bool:\n        return Capability(capability) in self._enabled\n\n    def require(self, capability: Capability | str) -> None:\n        capability = Capability(capability)\n        if not self.allows(capability):\n            raise CapabilityError(f\"\u0642\u0627\u0628\u0644\u06cc\u062a \u00ab{capability.value}\u00bb \u0641\u0639\u0627\u0644 \u0646\u06cc\u0633\u062a.\")\n\n    def enabled(self) -> frozenset[Capability]:\n        return frozenset(self._enabled)\n\n@dataclass(frozen=True)\nclass RuntimeContext:\n    \"\"\"\u0633\u06cc\u0627\u0633\u062a \u0642\u0627\u0628\u0644\u06cc\u062a\u200c\u0647\u0627\u06cc \u06cc\u06a9 \u0627\u062c\u0631\u0627\u06cc \u0645\u0634\u062e\u0635\u061b \u067e\u06cc\u0634\u200c\u0641\u0631\u0636 \u0641\u0642\u0637 core \u0627\u0633\u062a.\"\"\"\n    registry: CapabilityRegistry = field(default_factory=CapabilityRegistry)\n    project_root: str | None = None\n\n    @classmethod\n    def from_capabilities(cls, enabled: Sequence[Capability | str] | None = None, project_root: str | None = None):\n        return cls(CapabilityRegistry(enabled), project_root)\n\n    def require(self, capability: Capability | str) -> None:\n        self.registry.require(capability)\n\ndef node_id(source: str, ordinal: int, kind: str) -> NodeId:\n    \"\"\"\u062a\u0648\u0644\u06cc\u062f \u0634\u0646\u0627\u0633\u0647\u0654 \u0642\u0627\u0628\u0644 \u062a\u06a9\u0631\u0627\u0631 \u0628\u0631\u0627\u06cc node \u062f\u0631 \u06cc\u06a9 parse \u0645\u0634\u062e\u0635.\"\"\"\n    return NodeId(f\"{source}:{ordinal}:{kind}\")\n\ndef v1_contract() -> Mapping[str, Any]:\n    \"\"\"\u0642\u0631\u0627\u0631\u062f\u0627\u062f \u0633\u0627\u0632\u06af\u0627\u0631\u06cc \u0642\u0627\u0628\u0644 \u0628\u0631\u0631\u0633\u06cc \u0628\u0631\u0627\u06cc \u0628\u0631\u0646\u0627\u0645\u0647\u200c\u0647\u0627\u06cc \u0646\u0633\u062e\u0647\u0654 \u06f1.\"\"\"\n    return {\n        \"language\": LANGUAGE_V1,\n        \"text_delimiter\": \"-...-\",\n        \"assignment\": [\"\u0628\u06af\u0630\u0627\u0631 ... \u0628\u0631\u0627\u0628\u0631 ...\", \"name = expression\"],\n        \"indentation\": True,\n        \"unicode_identifiers\": True,\n        \"capabilities_default\": [Capability.CORE.value],\n        \"unsafe_python_import\": False,\n    }\n", "audio.py": "\"\"\"\u0633\u0631\u0648\u06cc\u0633 \u0635\u0648\u062a \u062a\u06cc\u0631\u0648\u062a\u06cc\u0631: \u062a\u0648\u0644\u06cc\u062f WAV \u0648 \u067e\u062e\u0634 \u062a\u0631\u062a\u06cc\u0628\u06cc \u06cc\u06a9 sequence \u0628\u0627 backend \u0645\u0648\u062c\u0648\u062f.\"\"\"\nfrom pathlib import Path\nimport math, shutil, struct, subprocess, sys, wave\n\nclass AudioBackendUnavailable(RuntimeError): pass\n\ndef _frequency(note):\n    notes={'\u062f\u0648':261.63,'\u0631':293.66,'\u0631\u0650':293.66,'\u0645\u06cc':329.63,'\u0641\u0627':349.23,'\u0633\u0644':392.00,'\u0644\u0627':440.00,'\u0633\u06cc':493.88}\n    try:return float(note)\n    except (TypeError,ValueError):\n        key=str(note).strip(); value=notes.get(key)\n        if value is None: raise ValueError(f'\u0646\u062a \u00ab{key}\u00bb \u0634\u0646\u0627\u062e\u062a\u0647 \u0646\u0634\u062f.')\n        return value\n\ndef render_sequence(notes, path='tirotir-note.wav', rate=44100):\n    \"\"\"notes iterable of (frequency/name, duration); writes one contiguous WAV.\"\"\"\n    frames=[]\n    for note,duration in notes:\n        freq=_frequency(note); count=max(1,int(rate*float(duration)))\n        frames.extend(struct.pack('<h',int(12000*math.sin(2*math.pi*freq*i/rate))) for i in range(count))\n    target=Path(path)\n    with wave.open(str(target),'wb') as out:\n        out.setnchannels(1); out.setsampwidth(2); out.setframerate(rate); out.writeframes(b''.join(frames))\n    return str(target)\n\ndef play_file(path: str|Path, *, wait=True) -> str:\n    path=str(Path(path).resolve()); commands=[]\n    if sys.platform.startswith('win'):\n        commands=[['powershell','-NoProfile','-Command',f'(New-Object Media.SoundPlayer \"{path}\").PlaySync()']]\n    elif sys.platform == 'darwin': commands=[['afplay',path]]\n    else:\n        for name in ('aplay','paplay','ffplay'):\n            if shutil.which(name): commands.append([name,'-nodisp','-autoexit',path] if name=='ffplay' else [name,path])\n    if not commands: raise AudioBackendUnavailable('\u067e\u062e\u0634\u200c\u06a9\u0646\u0646\u062f\u0647\u0654 \u0635\u0648\u062a\u06cc \u067e\u06cc\u062f\u0627 \u0646\u0634\u062f\u061b \u0641\u0627\u06cc\u0644 WAV \u062a\u0648\u0644\u06cc\u062f \u0634\u062f\u0647 \u0627\u0633\u062a.')\n    last=None\n    for command in commands:\n        try:\n            subprocess.run(command, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=120)\n            return path\n        except (OSError, subprocess.SubprocessError) as exc: last=exc\n    raise AudioBackendUnavailable('\u067e\u062e\u0634 \u0635\u0648\u062a \u0646\u0627\u0645\u0648\u0641\u0642 \u0628\u0648\u062f\u061b \u0641\u0627\u06cc\u0644 WAV \u062a\u0648\u0644\u06cc\u062f \u0634\u062f\u0647 \u0627\u0633\u062a.') from last\n", "semantic.py": "\"\"\"\u062a\u062d\u0644\u06cc\u0644 \u0645\u0639\u0646\u0627\u06cc\u06cc \u062a\u06cc\u0631\u0648\u062a\u06cc\u0631\u061b \u0645\u0633\u062a\u0642\u0644 \u0627\u0632 interpreter \u0648 \u0628\u062f\u0648\u0646 side effect.\"\"\"\nfrom dataclasses import dataclass, field\nfrom typing import Any\nfrom .contracts import Diagnostic, NodeId, SourceSpan, node_id\nfrom .core import (Assign, Bin, Break, Call, Continue, Decl, DictNode, ExprStmt,\n                   For, Func, If, Index, ListNode, Lit, Node, Print, Program,\n                   Repeat, Return, Unary, Var, While)\n\n@dataclass(frozen=True)\nclass Symbol:\n    name: str\n    kind: str\n    scope: str\n    span: SourceSpan = field(default_factory=SourceSpan)\n    node_id: NodeId = field(default_factory=lambda: NodeId(\"unknown\"))\n\n@dataclass\nclass Scope:\n    name: str\n    parent: 'Scope|None' = None\n    symbols: dict[str, Symbol] = field(default_factory=dict)\n    children: list['Scope'] = field(default_factory=list)\n\n    def define(self, symbol: Symbol) -> bool:\n        if symbol.name in self.symbols:\n            return False\n        self.symbols[symbol.name] = symbol\n        return True\n\n    def lookup(self, name: str) -> Symbol|None:\n        if name in self.symbols:\n            return self.symbols[name]\n        return self.parent.lookup(name) if self.parent else None\n\n@dataclass\nclass SymbolTable:\n    global_scope: Scope\n    scopes: list[Scope] = field(default_factory=list)\n\n@dataclass\nclass SemanticResult:\n    symbols: SymbolTable\n    diagnostics: list[Diagnostic]\n\nBUILTINS = {\n    '\u0637\u0648\u0644','\u0627\u0641\u0632\u0648\u062f\u0646','\u062d\u0630\u0641','\u0628\u0647_\u0639\u062f\u062f','\u0628\u0647_\u0645\u062a\u0646','\u0628\u062e\u0648\u0627\u0646',\n    '\u067e\u0646\u062c\u0631\u0647_\u0628\u0627\u0632\u06a9\u0646','\u067e\u0646\u062c\u0631\u0647_\u0628\u0628\u0646\u062f','\u067e\u0627\u06a9_\u06a9\u0646','\u062d\u0631\u06a9\u062a','\u0639\u0642\u0628_\u0628\u0631\u0648','\u0686\u0631\u062e\u0634',\n    '\u0628\u0647_\u0633\u0645\u062a','\u0642\u0644\u0645_\u067e\u0627\u06cc\u06cc\u0646','\u0642\u0644\u0645_\u0628\u0627\u0644\u0627','\u0631\u0646\u06af_\u0642\u0644\u0645','\u0636\u062e\u0627\u0645\u062a_\u0642\u0644\u0645',\n    '\u0645\u0631\u0628\u0639','\u0645\u0633\u062a\u0637\u06cc\u0644','\u062f\u0627\u06cc\u0631\u0647','\u0645\u062b\u0644\u062b','\u067e\u0631_\u06a9\u0646','\u0646\u062a_\u0628\u0646\u0648\u0627\u0632','\u0645\u0648\u0633\u06cc\u0642\u06cc_\u067e\u062e\u0634_\u06a9\u0646',\n    '\u067e\u0646\u062c\u0631\u0647_\u0628\u0633\u0627\u0632','\u0628\u0631\u0686\u0633\u0628_\u0628\u0633\u0627\u0632','\u062f\u06a9\u0645\u0647_\u0628\u0633\u0627\u0632','\u0648\u0631\u0648\u062f\u06cc_\u0628\u0633\u0627\u0632',\n    '\u0686\u06a9_\u0628\u0627\u06a9\u0633_\u0628\u0633\u0627\u0632','\u0644\u06cc\u0633\u062a_\u0628\u0633\u0627\u0632','\u0645\u0646\u0648\u06cc_\u0627\u0646\u062a\u062e\u0627\u0628_\u0628\u0633\u0627\u0632','\u0645\u062a\u0646_\u0686\u0646\u062f\u062e\u0637\u06cc_\u0628\u0633\u0627\u0632',\n    '\u0646\u0648\u0627\u0631_\u0644\u063a\u0632\u0634_\u0628\u0633\u0627\u0632','\u0646\u0645\u0627\u06cc\u0634_\u067e\u0646\u062c\u0631\u0647',\n}\nRUNTIME_ASSIGNMENTS = {'\u0631\u0646\u06af_\u0642\u0644\u0645', '\u0636\u062e\u0627\u0645\u062a_\u0642\u0644\u0645'}\n\nclass SemanticAnalyzer:\n    \"\"\"AST \u0631\u0627 \u0645\u06cc\u200c\u062e\u0648\u0627\u0646\u062f \u0648 \u0641\u0642\u0637 SymbolTable \u0648 Diagnostic \u062a\u0648\u0644\u06cc\u062f \u0645\u06cc\u200c\u06a9\u0646\u062f.\"\"\"\n    def __init__(self, source: str = '<\u0645\u062a\u0646>'):\n        self.source = source\n        self.diagnostics: list[Diagnostic] = []\n        self.ordinal = 0\n        self.global_scope = Scope('global')\n        self.table = SymbolTable(self.global_scope)\n        self.current = self.global_scope\n        self.function_depth = 0\n        self.loop_depth = 0\n        self.functions: dict[str, Func] = {}\n\n    def _span(self) -> SourceSpan:\n        # \u062a\u0627 \u0632\u0645\u0627\u0646 \u0627\u062a\u0635\u0627\u0644 \u06a9\u0627\u0645\u0644 span \u0628\u0647 \u0647\u0645\u0647\u0654 AST node\u0647\u0627\u060c \u0645\u06a9\u0627\u0646 \u0627\u0645\u0646 \u0648 \u0645\u0639\u062a\u0628\u0631 \u0645\u0646\u0628\u0639\n        return SourceSpan(source=self.source)\n\n    def _diagnostic(self, code: str, typ: str, message: str, suggestion: str|None=None) -> None:\n        self.diagnostics.append(Diagnostic(code, 'error', typ, message, self._span(), suggestion))\n\n    def _new_id(self, kind: str) -> NodeId:\n        self.ordinal += 1\n        return node_id(self.source, self.ordinal, kind)\n\n    def analyze(self, program: Program) -> SemanticResult:\n        # \u062a\u0648\u0627\u0628\u0639 \u067e\u06cc\u0634 \u0627\u0632 \u0639\u0628\u0648\u0631 \u0627\u0632 \u0628\u062f\u0646\u0647 \u062b\u0628\u062a \u0645\u06cc\u200c\u0634\u0648\u0646\u062f \u062a\u0627 \u0641\u0631\u0627\u062e\u0648\u0627\u0646\u06cc forward \u0648 recursion \u0645\u062c\u0627\u0632 \u0628\u0627\u0634\u062f.\n        for statement in program.body:\n            if isinstance(statement, Func):\n                self.functions[statement.name] = statement\n                self._define(statement.name, 'function')\n        self._statements(program.body)\n        return SemanticResult(self.table, self.diagnostics)\n\n    def _define(self, name: str, kind: str) -> None:\n        symbol = Symbol(name, kind, self.current.name, self._span(), self._new_id(kind))\n        if not self.current.define(symbol):\n            old = self.current.symbols[name]\n            if kind == 'constant' or old.kind == 'constant' or kind == 'function':\n                self._diagnostic('TIR2002','duplicate_definition',f'\u0646\u0627\u0645 \u00ab{name}\u00bb \u062f\u0631 \u0627\u06cc\u0646 scope \u0642\u0628\u0644\u0627\u064b \u062a\u0639\u0631\u06cc\u0641 \u0634\u062f\u0647 \u0627\u0633\u062a.', '\u0646\u0627\u0645 \u062f\u06cc\u06af\u0631\u06cc \u0627\u0646\u062a\u062e\u0627\u0628 \u06a9\u0646.')\n\n    def _statements(self, statements: list[Node]) -> None:\n        for statement in statements:\n            self._statement(statement)\n\n    def _statement(self, statement: Node) -> None:\n        if isinstance(statement, Decl):\n            kind = 'constant' if statement.const else 'variable'\n            # \u00ab\u0628\u06af\u0630\u0627\u0631\u00bb \u0628\u0631\u0627\u06cc \u0645\u0642\u062f\u0627\u0631\u062f\u0647\u06cc \u062f\u0648\u0628\u0627\u0631\u0647 \u0646\u06cc\u0632 syntax \u0631\u0633\u0645\u06cc \u0627\u0633\u062a.\n            if statement.const or not self.current.lookup(statement.name):\n                self._define(statement.name, kind)\n            self._expression(statement.expr)\n        elif isinstance(statement, Assign):\n            if isinstance(statement.target, Var):\n                symbol = self.current.lookup(statement.target.name)\n                if not symbol and statement.target.name not in RUNTIME_ASSIGNMENTS:\n                    self._undefined(statement.target.name)\n                elif symbol and symbol.kind == 'constant':\n                    self._diagnostic('TIR2003','constant_assignment',f'\u062b\u0627\u0628\u062a \u00ab{statement.target.name}\u00bb \u0642\u0627\u0628\u0644 \u062a\u063a\u06cc\u06cc\u0631 \u0646\u06cc\u0633\u062a.')\n            else:\n                self._expression(statement.target)\n            self._expression(statement.expr)\n        elif isinstance(statement, (Print, ExprStmt)):\n            self._expression(statement.expr)\n        elif statement.__class__.__name__ == 'Input':\n            return\n        elif isinstance(statement, If):\n            for condition, body in statement.branches:\n                self._expression(condition); self._statements(body)\n            self._statements(statement.otherwise)\n        elif isinstance(statement, While):\n            self._expression(statement.cond)\n            self.loop_depth += 1; self._statements(statement.body); self.loop_depth -= 1\n        elif isinstance(statement, For):\n            self._expression(statement.expr)\n            self._define_if_missing(statement.name, 'variable')\n            self.loop_depth += 1; self._statements(statement.body); self.loop_depth -= 1\n        elif isinstance(statement, Repeat):\n            self._expression(statement.count)\n            self.loop_depth += 1; self._statements(statement.body); self.loop_depth -= 1\n        elif isinstance(statement, Func):\n            self.function_depth += 1\n            child = Scope(f'function:{statement.name}', self.current)\n            self.current.children.append(child); self.table.scopes.append(child)\n            old = self.current; self.current = child\n            for argument in statement.args: self._define_if_missing(argument, 'parameter')\n            self._statements(statement.body)\n            self.current = old; self.function_depth -= 1\n        elif isinstance(statement, Return):\n            if self.function_depth == 0:\n                self._diagnostic('TIR2004','return_outside_function','\u00ab\u0628\u0627\u0632\u06af\u0631\u062f\u0627\u0646\u00bb \u0641\u0642\u0637 \u062f\u0627\u062e\u0644 \u062a\u0627\u0628\u0639 \u0645\u062c\u0627\u0632 \u0627\u0633\u062a.')\n            if statement.expr: self._expression(statement.expr)\n        elif isinstance(statement, Break):\n            if self.loop_depth == 0:self._diagnostic('TIR2005','break_outside_loop','\u00ab\u0628\u06cc\u0631\u0648\u0646\u00bb \u0641\u0642\u0637 \u062f\u0627\u062e\u0644 \u062d\u0644\u0642\u0647 \u0645\u062c\u0627\u0632 \u0627\u0633\u062a.')\n        elif isinstance(statement, Continue):\n            if self.loop_depth == 0:self._diagnostic('TIR2006','continue_outside_loop','\u00ab\u0627\u062f\u0627\u0645\u0647\u00bb \u0641\u0642\u0637 \u062f\u0627\u062e\u0644 \u062d\u0644\u0642\u0647 \u0645\u062c\u0627\u0632 \u0627\u0633\u062a.')\n\n    def _define_if_missing(self, name: str, kind: str) -> None:\n        if not self.current.lookup(name): self._define(name, kind)\n\n    def _undefined(self, name: str) -> None:\n        self._diagnostic('TIR2001','undefined_name',f'\u0645\u062a\u063a\u06cc\u0631 \u00ab{name}\u00bb \u067e\u06cc\u062f\u0627 \u0646\u0634\u062f.', '\u0627\u0628\u062a\u062f\u0627 \u0622\u0646 \u0631\u0627 \u0628\u0627 \u00ab\u0628\u06af\u0630\u0627\u0631\u00bb \u062a\u0639\u0631\u06cc\u0641 \u06a9\u0646.')\n\n    def _expression(self, expression: Node) -> None:\n        if isinstance(expression, (Lit,)): return\n        if isinstance(expression, Var):\n            if not self.current.lookup(expression.name) and expression.name not in BUILTINS and expression.name not in self.functions:\n                self._undefined(expression.name)\n        elif isinstance(expression, (ListNode,)):\n            for item in expression.items:self._expression(item)\n        elif isinstance(expression, DictNode):\n            for _, value in expression.items:self._expression(value)\n        elif isinstance(expression, Index):\n            self._expression(expression.obj)\n            # \u062f\u0631 \u00ab\u0634\u062e\u0635[\u0633\u0646]\u00bb\u060c \u0646\u0627\u0645 \u0646\u0627\u0634\u0646\u0627\u062e\u062a\u0647 \u0645\u06cc\u200c\u062a\u0648\u0627\u0646\u062f \u06a9\u0644\u06cc\u062f \u0645\u062a\u0646\u06cc \u0641\u0631\u0647\u0646\u06af \u0628\u0627\u0634\u062f\u061b\n            # \u0646\u0627\u0645\u200c\u0647\u0627\u06cc \u0634\u0646\u0627\u062e\u062a\u0647\u200c\u0634\u062f\u0647 \u0647\u0645\u0686\u0646\u0627\u0646 \u0628\u0647\u200c\u0639\u0646\u0648\u0627\u0646 expression \u062a\u062d\u0644\u06cc\u0644 \u0645\u06cc\u200c\u0634\u0648\u0646\u062f.\n            if not (isinstance(expression.key, Var) and not self.current.lookup(expression.key.name)):\n                self._expression(expression.key)\n        elif isinstance(expression, Unary):self._expression(expression.expr)\n        elif isinstance(expression, Bin):self._expression(expression.left);self._expression(expression.right)\n        elif isinstance(expression, Call):\n            if expression.name not in BUILTINS and expression.name not in self.functions:\n                self._undefined(expression.name)\n            if expression.name in self.functions:\n                expected=len(self.functions[expression.name].args); actual=len(expression.args)\n                if expected != actual:\n                    self._diagnostic('TIR2007','argument_count_mismatch',f'\u062a\u0639\u062f\u0627\u062f \u0622\u0631\u06af\u0648\u0645\u0627\u0646\u200c\u0647\u0627\u06cc \u062a\u0627\u0628\u0639 \u00ab{expression.name}\u00bb \u0646\u0627\u062f\u0631\u0633\u062a \u0627\u0633\u062a.',f'{expected} \u0622\u0631\u06af\u0648\u0645\u0627\u0646 \u0644\u0627\u0632\u0645 \u0627\u0633\u062a.')\n            for argument in expression.args:self._expression(argument)\n"}</script>
